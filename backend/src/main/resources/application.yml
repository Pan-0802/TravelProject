server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: travel-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/travel_planner_course_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 1000
      transaction-isolation: TRANSACTION_READ_COMMITTED
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      fail-on-unknown-properties: true
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
app:
  jwt:
    secret: ${JWT_SECRET:}
    expires-in: 86400
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:5175,http://127.0.0.1:5175}
  external:
    amap-key: ${AMAP_KEY:}
    ai-key: ${AI_API_KEY:}
    ai-base-url: ${AI_BASE_URL:https://api.deepseek.com}
    ai-model: ${AI_MODEL:deepseek-flash}
    timeout-seconds: ${EXTERNAL_TIMEOUT_SECONDS:60}
    ai-max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:16384}
    amap-interval-millis: ${AMAP_INTERVAL_MILLIS:650}
