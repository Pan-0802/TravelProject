<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <title>个人旅行记录与智能规划系统｜总 E-R 图</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        .toolbar {
            width: 1440px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn {
            background: #374151;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: #1f2937;
        }

        .btn.secondary {
            background: #ffffff;
            color: #374151;
            border: 1px solid #9ca3af;
        }

        .btn.secondary:hover {
            background: #f9fafb;
        }

        .canvas-container {
            width: 1440px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        svg {
            display: block;
            width: 1440px;
            height: 1020px;
        }

        /* 标题与图例 */
        .title {
            font-size: 24px;
            font-weight: 700;
            fill: #111827;
        }

        .subtitle {
            font-size: 13px;
            fill: #4b5563;
        }

        .legend-bg {
            fill: #ffffff;
            stroke: #6b7280;
            stroke-width: 1.2;
        }

        .legend-text {
            font-size: 12.5px;
            fill: #374151;
        }

        /* 经典 Chen 实体与联系 */
        .entity-box {
            fill: #ffffff;
            stroke: #4b5563;
            stroke-width: 1.8;
        }

        .entity-cn {
            font-size: 14px;
            font-weight: 600;
            fill: #111827;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .entity-en {
            font-size: 12px;
            font-weight: 500;
            fill: #374151;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .rel-diamond {
            fill: #ffffff;
            stroke: #4b5563;
            stroke-width: 1.8;
        }

        .rel-text {
            font-size: 13.5px;
            font-weight: 500;
            fill: #111827;
            text-anchor: middle;
            dominant-baseline: central;
        }

        /* 实线连接 */
        .conn-line {
            stroke: #4b5563;
            stroke-width: 1.6;
            fill: none;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        /* 基数文字 */
        .card-text {
            font-size: 14px;
            font-weight: 500;
            fill: #374151;
            text-anchor: middle;
            dominant-baseline: central;
        }

        /* 底部实体属性一览 */
        .attr-section-title {
            font-size: 15.5px;
            font-weight: 700;
            fill: #111827;
        }

        .attr-card {
            fill: #ffffff;
            stroke: #9ca3af;
            stroke-width: 1.2;
        }

        .attr-header {
            font-size: 13.5px;
            font-weight: 700;
            fill: #111827;
        }

        .attr-pk {
            font-size: 12px;
            fill: #1f2937;
        }

        .attr-pk-underline {
            text-decoration: underline;
            font-weight: 600;
            fill: #111827;
        }

        .attr-line {
            font-size: 12px;
            fill: #4b5563;
        }

        .footer-note {
            font-size: 12px;
            fill: #6b7280;
        }

        @media print {
            body {
                background: #ffffff;
                padding: 0;
            }

            .toolbar {
                display: none;
            }

            .canvas-container {
                border: none;
                box-shadow: none;
            }
        }
    </style>
</head>

    <script>
        function exportPNG() {
            const svg = document.getElementById("erSvg");
            const serializer = new XMLSerializer();
            const svgStr = serializer.serializeToString(svg);
            const scale = 2;
            const canvas = document.createElement("canvas");
            canvas.width = 1440 * scale;
            canvas.height = 1020 * scale;
            const ctx = canvas.getContext("2d");

            const img = new Image();
            const blob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(blob);

            img.onload = function () {
                ctx.scale(scale, scale);
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                const pngUrl = canvas.toDataURL("image/png");
                const a = document.createElement("a");
                a.href = pngUrl;
                a.download = "个人旅行记录与智能规划系统_总ER图.png";
                a.click();
            };
            img.src = url;
        }
    </script>
